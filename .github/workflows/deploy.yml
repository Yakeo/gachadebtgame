name: Deploy (Supabase + Vercel)

# Manual: Actions tab -> "Deploy (Supabase + Vercel)" -> Run workflow.
# Automatic: every push to main.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DATABASE_URL  Transaction pooler (:6543) - the running game
#   SUPABASE_SESSION_URL   Session pooler (:5432)    - applying the schema
#   VERCEL_TOKEN           vercel.com/account/tokens
# Optional: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (added to Vercel if set)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_NAME: gachadebtgame
      # The stable production domain. Verification must use this, never the
      # per-deployment URL that `vercel deploy` prints: those throwaway URLs
      # answer 404 DEPLOYMENT_NOT_FOUND (that false failure is what turned runs
      # 3 and 4 red while the site itself was healthy). APP_URL is also set to
      # this domain *before* deploying, so Google's redirect URI stays stable.
      PRODUCTION_DOMAIN: gachadebtgame.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Reports which secrets exist and whether their shape is usable, without
      # ever printing a secret. Runs even when the deploy later fails, so the
      # run page always shows the configuration it worked with.
      - name: Preflight — report Supabase configuration
        continue-on-error: true
        env:
          SUPABASE_SESSION_URL: ${{ secrets.SUPABASE_SESSION_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: node scripts/diagnose-supabase.mjs --no-connect

      - name: Apply Supabase schema (supabase/schema.sql)
        env:
          SUPABASE_SESSION_URL: ${{ secrets.SUPABASE_SESSION_URL }}
        run: node scripts/apply-supabase-schema.mjs

      - name: Install Vercel CLI
        run: npm install -g vercel@63

      # Fail here, with one clear message, instead of at step 5 of 6 with a
      # stack of "permission denied"/"project not found" errors.
      - name: Verify the Vercel token
        run: |
          if vercel_user=$(vercel whoami --token "$VERCEL_TOKEN" 2>&1); then
            echo "Authenticated to Vercel as: $vercel_user"
          else
            DETAIL=$(printf '%s' "$vercel_user" | tr '\n' ' ' | cut -c1-400 | sed 's/%/%25/g')
            echo "::error title=Vercel token rejected::vercel whoami failed: ${DETAIL}"
            echo "Create a new token at https://vercel.com/account/tokens (scope: your personal account or the team"
            echo "that owns the project) and store it as the repository secret VERCEL_TOKEN."
            exit 1
          fi

      - name: Create + link Vercel project
        run: |
          vercel project create "$PROJECT_NAME" --token "$VERCEL_TOKEN" || echo "Project may already exist, continuing"
          vercel link --yes --project "$PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Set Vercel production env vars
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_SESSION_URL: ${{ secrets.SUPABASE_SESSION_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set_env() {
            # $1=name $2=value; skips empty values (e.g. optional Google vars)
            if [ -n "$2" ]; then
              vercel env add "$1" production --value "$2" --force --yes --token "$VERCEL_TOKEN"
              echo "set $1"
            else
              echo "skipped $1 (empty)"
            fi
          }
          set_env APP_URL "https://$PRODUCTION_DOMAIN"
          set_env DATABASE_URL "$SUPABASE_DATABASE_URL"
          set_env DIRECT_URL "$SUPABASE_SESSION_URL"
          set_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          set_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          [ -n "$GITHUB_STEP_SUMMARY" ] && echo "Deployed deployment $URL" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify /api/health and homepage
        # The deployment URL is passed through the environment on purpose: an
        # ${{ }} expression inside a quoted shell string expands to nothing if
        # the step is ever run by hand, and `${...}` reads as a bad substitution.
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          URL="https://$PRODUCTION_DOMAIN"
          echo "Verifying $URL/api/health (deployment: $DEPLOYMENT_URL)"
          for i in $(seq 1 30); do
            HEALTH=$(curl -s -m 10 "$URL/api/health" || true)
            echo "attempt $i: $HEALTH"
            if [ "$HEALTH" = '{"ok":true}' ]; then echo "health OK"; break; fi
            if [ "$i" = "30" ]; then
              echo "::error title=Live site is not healthy::$URL/api/health did not return {\"ok\":true} within 5 minutes. Check Vercel runtime logs; the database env vars are the usual cause (DEPLOYMENT.md section 6)."
              exit 1
            fi
            sleep 10
          done
          curl -s -o /dev/null -w "homepage: %{http_code}\n" -m 15 "$URL/"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then echo "Live at $URL" >> "$GITHUB_STEP_SUMMARY"; fi
